name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/emotion-api

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - run: pip install -r requirements.txt pytest
      - run: pytest tests/unit -q

  integration:
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4

      - name: Materialize local secret files
        env:
          CASSANDRA_PASSWORD: ${{ secrets.CASSANDRA_PASSWORD }}
        run: |
          cp .env.example .env
          cp vault/vault.env.example vault/vault.env
          cat > vault/seed.sh <<'SEED'
          export VAULT_ADDR=http://127.0.0.1:8200 VAULT_TOKEN=root
          vault kv put secret/mlops-app \
            CASSANDRA_HOSTS=cassandra \
            CASSANDRA_PORT=9042 \
            CASSANDRA_KEYSPACE=dog_emotion_keyspace \
            CASSANDRA_USER=emotion_app \
            CASSANDRA_PASSWORD='__CASSANDRA_PASSWORD__' \
            CASSANDRA_BOOTSTRAP_USER=cassandra \
            CASSANDRA_BOOTSTRAP_PASSWORD=cassandra
          SEED
          sed -i "s|__CASSANDRA_PASSWORD__|${CASSANDRA_PASSWORD}|" vault/seed.sh

      - name: Pull model checkpoint (DVC)
        env:
          GDRIVE_SA_JSON: ${{ secrets.GDRIVE_SA_JSON }}
        run: |
          pip install "dvc[gdrive]" "pyOpenSSL==24.2.1" "cryptography<44"
          echo "$GDRIVE_SA_JSON" > /tmp/sa.json
          dvc remote modify --local gdrive gdrive_use_service_account true
          dvc remote modify --local gdrive gdrive_service_account_json_file_path /tmp/sa.json
          dvc pull expirements/dog_emotion_efficientnet_best.pth.dvc

      - name: Start stack
        run: docker compose up -d --build

      - name: Wait for API
        run: |
          for i in $(seq 1 60); do
            curl -sf http://localhost:8000/health && exit 0
            sleep 5
          done
          echo "API not healthy"; exit 1

      - name: Functional tests
        run: |
          pip install -r requirements.txt pytest requests
          BASE_URL=http://localhost:8000 pytest tests/functional -q

      - name: Dump compose logs
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down -v

  publish:
    runs-on: ubuntu-latest
    needs: integration
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
